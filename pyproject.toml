[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-analyst"
version = "0.2.0"
description = "Traceable full-paper research analyst for empirical asset pricing and ML in finance"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "requests>=2.28",
  "pdfplumber>=0.11",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
claude = ["anthropic>=1.0"]
dev = ["pytest>=7", "reportlab>=4.0"]  # reportlab builds PDF test fixtures

[project.scripts]
paper-analyst = "paper_analyst.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paper_analyst = ["mock_data/*.json", "mock_data/*.xml", "profiles/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
